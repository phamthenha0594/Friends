  {en:`Well, you know, in here, anyone who...`,ph:`wɛl, juː noʊ, ɪn hɪər, ˈɛniˌwʌn huː...`,vi:`Ồ, em biết đấy, ở đây, bất kỳ ai...`},
  {en:`Stands erect...`,ph:`stændz ɪˈrɛkt...`,vi:`đứng thẳng...`},
  {en:`So, what's new? Still a...`,ph:`soʊ, wɒts nuː? stɪl ə...`,vi:`Vậy có gì mới không? Vẫn là...`},
  {en:`A lesbian?`,ph:`ə ˈlɛzbiən?`,vi:`Đồng tính?`},
  {en:`Well...`,ph:`wɛl...`,vi:`À thì...`},
  {en:`You never know.`,ph:`juː ˈnɛvər noʊ.`,vi:`Ai mà biết được.`},
  {en:`How's, um...? How's the family?`,ph:`haʊz, ʌm...? haʊz ðə ˈfæməli?`,vi:`Gia đình thế nào?`},
  {en:`Marty's still totally paranoid.`,ph:`ˈmɑːrtiz stɪl ˈtoʊtəli ˈpærəˌnɔɪd.`,vi:`Marty vẫn hoang tưởng nặng lắm.`},
  {en:`Oh, and... Carol, why are you here, Carol?`,ph:`oʊ, ænd... ˈkærəl, waɪ ɑːr juː hɪər, ˈkærəl?`,vi:`Ồ, và... Carol, sao em đến đây?`},
  {en:`I'm pregnant. Pregnant.`,ph:`aɪm ˈprɛɡnənt. ˈprɛɡnənt.`,vi:`Em có thai rồi. Có thai?`},
  {en:`Oh. Looks like she didn't leave in such a hurry after all.`,ph:`oʊ. lʊks laɪk ʃiː ˈdɪdnt liːv ɪn sʌtʃ ə ˈhɜːri ˈæftər ɔːl.`,vi:`Có vẻ cô ấy chẳng ra đi vội vàng mấy nhỉ.`},
  {en:`I think this is the episode of Three's Company...`,ph:`aɪ θɪŋk ðɪs ɪz ði ˈɛpɪˌsoʊd ɒv θriːz ˈkʌmpəni...`,vi:`Ồ, tôi nghĩ đây là tập phim Three's Company`},
  {en:`Where's there's some kind of misunderstanding.`,ph:`wɛərz ðərz sʌm kaɪnd ɒv ˌmɪsʌnˈdɜːrstændɪŋ.`,vi:`có xảy ra hiểu lầm gì đó.`},
  {en:`Then I've already seen this one.`,ph:`ðɛn aɪv ɔːlˈrɛdi siːn ðɪs wʌn.`,vi:`Vậy thì tôi đã xem rồi.`},
  {en:`Are you through with that? Thanks.`,ph:`ɑːr juː θruː wɪð ðæt? θæŋks.`,vi:`Cậu xong chưa? Cảm ơn.`},
  {en:`Yeah, sorry, the swallowing slowed me down.`,ph:`jæ, ˈsɒri, ðə ˈswɒloʊɪŋ sloʊd miː daʊn.`,vi:`Vâng. Xin lỗi nhé, việc nuốt khiến tôi chậm lại.`},
  {en:`Whose little ball of paper is this?`,ph:`huːz ˈlɪtəl bɔːl ɒv ˈpeɪpər ɪz ðɪs?`,vi:`Cục giấy này là của ai vậy?`},
  {en:`Oh, that would be mine.`,ph:`oʊ, ðæt wʊd biː maɪn.`,vi:`Ồ, chắc là của tôi.`},
  {en:`See, I wrote a note to myself, then I didn't need it.`,ph:`siː, aɪ roʊt ə noʊt tuː maɪˈsɛlf, ðɛn aɪ ˈdɪdnt niːd ɪt.`,vi:`Tôi đã viết một ghi chú, rồi tôi thấy không cần thiết`},
  {en:`So I balled it up and now I wish I was dead.`,ph:`soʊ aɪ bɔːld ɪt ʌp ænd naʊ aɪ wɪʃ aɪ wɒz dɛd.`,vi:`nên đã vo giấy lại và giờ tôi ước gì mình đã chết.`},
  {en:`She already fluffed that pillow. Monica, you know, you already fluffed...`,ph:`ʃiː ɔːlˈrɛdi flʌft ðæt ˈpɪloʊ. ˈmɒnɪkə, juː noʊ, juː ɔːlˈrɛdi flʌft...`,vi:`Cô ấy phủi cái gối đó rồi. Monica, này, cậu đã phủi...`},
  {en:`But it's fine.`,ph:`bʌt ɪts faɪn.`,vi:`Nhưng tốt thôi.`},
  {en:`Look, I'm sorry.`,ph:`lʊk, aɪm ˈsɒri.`,vi:`Này, tôi xin lỗi.`},
  {en:`I don't want to give them any more ammunition than they have.`,ph:`aɪ doʊnt wɒnt tuː ɡɪv ðɛm ˈɛni mɔːr ˌæmjuˈnɪʃən ðæn ðeɪ hæv.`,vi:`Tôi chỉ không muốn họ có thêm thứ gì để công kích nữa.`},
  {en:`Yes, we know how cruel a parent can be...`,ph:`jɛs, wiː noʊ haʊ ˈkruːəl ə ˈpɛərənt kæn biː...`,vi:`Ừ, ta đều biết bố mẹ có thể gay gắt ra sao`},
  {en:`About the flatness of a child's pillow.`,ph:`əˈbaʊt ðə ˈflætnəs ɒv ə tʃaɪldz ˈpɪloʊ.`,vi:`về độ phẳng của cái gối cho con mà.`},
  {en:`Monica? Hi. Um...`,ph:`ˈmɒnɪkə? haɪ. ʌm...`,vi:`Monica? Chào!`},
  {en:`Monica, um, you're scaring me.`,ph:`ˈmɒnɪkə, ʌm, jʊər ˈskɛərɪŋ miː.`,vi:`Monica, cậu làm tôi sợ đấy.`},
  {en:`I mean, you're, like, all chaotic and twirly, you know?`,ph:`aɪ miːn, jʊər, laɪk, ɔːl keɪˈɒtɪk ænd ˈtwɜːrli, juː noʊ?`,vi:`Ý tôi là, cậu có vẻ rất hỗn loạn và hấp tấp, cậu biết chứ?`},
  {en:`Not in a good way.`,ph:`nɒt ɪn ə ɡʊd weɪ.`,vi:`Nhưng không phải kiểu tích cực.`},
  {en:`Yeah, calm down.`,ph:`jæ, kɑːm daʊn.`,vi:`Phải, bình tĩnh nào.`},
  {en:`You don't see Ross getting all chaotic and twirly every time they come.`,ph:`juː doʊnt siː rɒs ˈɡɛtɪŋ ɔːl keɪˈɒtɪk ænd ˈtwɜːrli ˈɛvri taɪm ðeɪ kʌm.`,vi:`Ross có hỗn loạn và hấp tấp như thế mỗi khi họ đến đâu.`},
  {en:`That's because, as far as my parents are concerned, Ross can do no wrong.`,ph:`ðæts bɪˈkəz, æz fɑːr æz maɪ ˈpɛərənts ɑːr kənˈsɜːrnd, rɒs kæn duː noʊ rɒŋ.`,vi:`Đó là vì theo như bố mẹ tôi nghĩ, Ross không bao giờ sai.`},
  {en:`You see, he's the prince.`,ph:`juː siː, hiːz ðə prɪns.`,vi:`Cậu biết đấy, anh ấy là hoàng tử.`},
  {en:`Apparently they had some big ceremony before I was born.`,ph:`əˈpɛrəntli ðeɪ hæd sʌm bɪɡ ˈsɛrəˌmoʊni bɪˈfɔːr aɪ wɒz bɔːrn.`,vi:`Rõ ràng họ đã có một nghi lễ lớn trước khi sinh tôi.`},
  {en:`What? Ugly Naked Guy got a ThighMaster.`,ph:`wɒt? ˈʌɡli ˈneɪkɪd ɡaɪ ɡɒt ə ˈθaɪˌmæstər.`,vi:`Sao vậy? Gã Xấu Xí Trần Truồng đã mua dụng cụ tập đùi.`},
  {en:`Has anybody seen my engagement ring?`,ph:`hæz ˈɛniˌbɒdi siːn maɪ ɪnˈɡeɪdʒmənt rɪŋ?`,vi:`Có ai thấy nhẫn đính hôn của tôi không?`},
  {en:`Yeah, it's beautiful.`,ph:`jæ, ɪts ˈbjuːtəfʊl.`,vi:`Có, nó rất đẹp.`},
  {en:`Oh, God. Oh, God.`,ph:`oʊ, ɡɒd. oʊ, ɡɒd.`,vi:`Chúa ơi!`},
  {en:`Oh, God, oh, God, oh, God.`,ph:`oʊ, ɡɒd, oʊ, ɡɒd, oʊ, ɡɒd.`,vi:`Chúa ơi!`},
  {en:`No, don't touch that.`,ph:`noʊ, doʊnt tʌtʃ ðæt.`,vi:`Không, đừng chạm vào đó.`},
  {en:`Oh, like I wasn't dreading tomorrow enough having to give it back to him.`,ph:`oʊ, laɪk aɪ ˈwɒznt ˈdrɛdɪŋ təˈmɒroʊ ɪˈnʌf ˈhævɪŋ tuː ɡɪv ɪt bæk tuː hɪm.`,vi:`Ngày mai tôi phải trả lại nhẫn cho anh ta, thế vẫn chưa đủ bi kịch hả?`},
  {en:`"Hi, Barry, remember me? I'm the girl...`,ph:`"haɪ, ˈbæri, rɪˈmɛmbər miː? aɪm ðə ɡɜːrl...`,vi:`"Chào Barry. Nhớ em chứ?`},
  {en:`That stomped on your heart in front of your entire family"`,ph:`ðæt stɒmpt ɒn jʊər hɑːrt ɪn frʌnt ɒv jʊər ɪnˈtaɪər ˈfæməli"`,vi:`Cô gái đội khăn voan làm tim anh tan vỡ trước mặt cả gia đình anh đây."`},
  {en:`Oh, God. Now I'm gonna have to return the ring, without the ring...`,ph:`oʊ, ɡɒd. naʊ aɪm ˈɡɒnə hæv tuː rɪˈtɜːrn ðə rɪŋ, wɪˈθaʊt ðə rɪŋ...`,vi:`Chúa ơi. Bây giờ tôi phải trả lại nhẫn trong khi không có nhẫn,`},
  {en:`Which makes it so much harder.`,ph:`wɪtʃ meɪks ɪt soʊ mʌtʃ ˈhɑːrdər.`,vi:`như vậy khó hơn rất nhiều.`},
  {en:`Easy, Rach, we'll find it. Won't we?`,ph:`ˈiːzi, reɪtʃ, wiːl faɪnd ɪt. woʊnt wiː?`,vi:`Bình tĩnh, Rach. Ta sẽ tìm được, đúng không?`},
  {en:`Oh, yeah.`,ph:`oʊ, jæ.`,vi:`Được rồi.`},
  {en:`Okay, look.`,ph:`oʊˈkeɪ, lʊk.`,vi:`Tìm đi.`},
  {en:`When did you have it on last?`,ph:`wɛn dɪd juː hæv ɪt ɒn læst?`,vi:`Cậu đeo nhẫn lần cuối khi nào?`},
  {en:`Doy. Probably right before she lost it.`,ph:`dɔɪ. ˈprɒbəbli raɪt bɪˈfɔːr ʃiː lɒst ɪt.`,vi:`Rõ như ban ngày! Chắc là ngay trước khi làm mất.`},
  {en:`You don't get a lot of "doy" these days.`,ph:`juː doʊnt ɡɛt ə lɒt ɒv "dɔɪ" ðiːz deɪz.`,vi:`Thời buổi này không có nhiều thứ rõ ràng đâu.`},
  {en:`I know I had it this morning.`,ph:`aɪ noʊ aɪ hæd ɪt ðɪs ˈmɔːrnɪŋ.`,vi:`Tôi nhớ sáng nay vẫn còn đeo.`},
  {en:`I know I had it when I was in the kitchen with...`,ph:`aɪ noʊ aɪ hæd ɪt wɛn aɪ wɒz ɪn ðə ˈkɪtʃɪn wɪð...`,vi:`Tôi nhớ mình vẫn đeo nhẫn khi đang ở trong bếp với...`},
  {en:`Dinah?`,ph:`ˈdaɪnə?`,vi:`Dinah hả?`},
  {en:`Oh, don't be mad.`,ph:`oʊ, doʊnt biː mæd.`,vi:`Ôi, đừng giận.`},
  {en:`You didn't.`,ph:`juː ˈdɪdnt.`,vi:`Không phải chứ?`},
  {en:`Oh, I'm sorry.`,ph:`oʊ, aɪm ˈsɒri.`,vi:`Ôi, tôi xin lỗi.`},
  {en:`I gave you one job.`,ph:`aɪ ɡeɪv juː wʌn dʒɒb.`,vi:`Tôi chỉ giao cho cậu có một việc thôi!`},
  {en:`Oh, but look how straight those noodles are.`,ph:`oʊ, bʌt lʊk haʊ streɪt ðoʊz ˈnuːdəlz ɑːr.`,vi:`Ồ, nhưng nhìn mấy lá mì thẳng chưa kìa.`},
  {en:`Monica, you know that's not how you look for an engagement ring in a lasagna.`,ph:`ˈmɒnɪkə, juː noʊ ðæts nɒt haʊ juː lʊk fɔːr ən ɪnˈɡeɪdʒmənt rɪŋ ɪn ə ləˈzɑːnjə.`,vi:`Monica, cậu biết đó không phải cách tìm nhẫn đính hôn trong đĩa mì lasagna mà.`},
  {en:`I just can't do it.`,ph:`aɪ dʒʌst kænt duː ɪt.`,vi:`Tôi không làm được.`},
  {en:`Boys?`,ph:`bɔɪz?`,vi:`Các chàng trai?`},
  {en:`We're going in.`,ph:`wɪər ˈɡoʊɪŋ ɪn.`,vi:`Ta vào cuộc thôi.`},
  {en:`Hi.`,ph:`haɪ.`,vi:`Chào.`},
  {en:`Oh, that is not a happy "hi."`,ph:`oʊ, ðæt ɪz nɒt ə ˈhæpi "haɪ."`,vi:`Câu "chào" này không vui gì cả.`},
  {en:`Carol's pregnant.`,ph:`ˈkærəlz ˈprɛɡnənt.`,vi:`Carol có thai rồi.`},
  {en:`Oh, I found it.`,ph:`oʊ, aɪ faʊnd ɪt.`,vi:`Ồ, tôi tìm được rồi!`},
  {en:`Well, what...? What?`,ph:`wɛl, wɒt...? wɒt?`,vi:`Sao...`},
  {en:`Yeah.`,ph:`jæ.`,vi:`Phải.`},
  {en:`Do that for another two hours...`,ph:`duː ðæt fɔːr əˈnʌðər tuː ˈaʊərz...`,vi:`Cứ làm vậy thêm hai tiếng nữa`},
  {en:`You might be where I am right about now.`,ph:`juː maɪt biː wɛər aɪ æm raɪt əˈbaʊt naʊ.`,vi:`và em cũng sẽ giống anh bây giờ đấy.`},
  {en:`Kind of puts that whole pillow thing in perspective, huh, Mon?`,ph:`kaɪnd ɒv pʊts ðæt hoʊl ˈpɪloʊ θɪŋ ɪn pərˈspɛktɪv, hʌ, mɒn?`,vi:`Chuyện này giúp có cái nhìn rõ hơn về vụ cái gối đấy, Mon nhỉ?`},
  {en:`Well, now, how do you fit into this whole thing?`,ph:`wɛl, naʊ, haʊ duː juː fɪt ˈɪntuː ðɪs hoʊl θɪŋ?`,vi:`Vậy giờ anh tiếp nhận chuyện đó thế nào?`},
  {en:`Well, Carol says she and Susan want me to be involved.`,ph:`wɛl, ˈkærəl sɛz ʃiː ænd ˈsuːzən wɒnt miː tuː biː ɪnˈvɒlvd.`,vi:`Ồ, Carol nói cô ấy và Susan muốn tôi tham gia.`},
  {en:`But if I'm not comfortable with it, I don't have to be involved.`,ph:`bʌt ɪf aɪm nɒt ˈkʌmfərtəbəl wɪð ɪt, aɪ doʊnt hæv tuː biː ɪnˈvɒlvd.`,vi:`Nhưng nếu không thấy thoải mái, tôi có thể không cần dính vào.`},
  {en:`Basically, it's totally up to me.`,ph:`ˈbeɪsɪkli, ɪts ˈtoʊtəli ʌp tuː miː.`,vi:`Về cơ bản là tùy ở tôi.`},
  {en:`She is so great. I miss her.`,ph:`ʃiː ɪz soʊ ɡreɪt. aɪ mɪs hɜːr.`,vi:`Cô ấy rất tuyệt. Tôi nhớ cô ấy.`},
  {en:`What does she mean by "involved"?`,ph:`wɒt dʌz ʃiː miːn baɪ "ɪnˈvɒlvd"?`,vi:`Ồ, cô ấy nói "tham gia" nghĩa là sao?`},
  {en:`I mean, presumably, the biggest part of your job is done.`,ph:`aɪ miːn, prɪˈzjuːməbli, ðə ˈbɪɡəst pɑːrt ɒv jʊər dʒɒb ɪz dʌn.`,vi:`Ý tôi là, có lẽ phần việc lớn nhất của cậu đã xong rồi.`},
  {en:`Anyway, they want me to go down to this...`,ph:`ˈɛniˌweɪ, ðeɪ wɒnt miː tuː ɡoʊ daʊn tuː ðɪs...`,vi:`Dù sao thì họ cũng muốn tôi`},
  {en:`Sonogram thing with them tomorrow.`,ph:`ˈsɒnəˌɡræm θɪŋ wɪð ðɛm təˈmɒroʊ.`,vi:`cùng đi siêu âm với họ ngày mai.`},
  {en:`So, what are you gonna do?`,ph:`soʊ, wɒt ɑːr juː ˈɡɒnə duː?`,vi:`Vậy cậu định làm gì?`},
  {en:`I have no idea.`,ph:`aɪ hæv noʊ aɪˈdiːə.`,vi:`Tôi không biết.`},
  {en:`No matter what I do, though, I'm still gonna be a father.`,ph:`noʊ ˈmætər wɒt aɪ duː, ðoʊ, aɪm stɪl ˈɡɒnə biː ə ˈfɑːðər.`,vi:`Nhưng dù có làm gì, tôi vẫn sắp làm bố rồi.`},
  {en:`Well, this is still ruined, right?`,ph:`wɛl, ðɪs ɪz stɪl ˈruːɪnd, raɪt?`,vi:`Món này hỏng rồi mà, đúng chứ?`},
  {en:`Oh. Martha Lugwin's daughter is gonna call you.`,ph:`oʊ. ˈmɑːrθə ˈlʌɡwɪnz ˈdɔːtər ɪz ˈɡɒnə kɔːl juː.`,vi:`Con gái của Martha Lugwin sẽ gọi cho con.`},
  {en:`Mm. What's that curry taste?`,ph:`mm. wɒts ðæt ˈkɜːri teɪst?`,vi:`Cà ri có vị gì vậy?`},
  {en:`Curry.`,ph:`ˈkɜːri.`,vi:`Vị cà ri.`},
  {en:`I think they're great. I really do.`,ph:`aɪ θɪŋk ðeər ɡreɪt. aɪ ˈrɪli duː.`,vi:`Anh nghĩ chúng rất ngon. Thật đấy.`},
  {en:`You remember the Lugwins?`,ph:`juː rɪˈmɛmbər ðə ˈlʌɡwɪnz?`,vi:`Con nhớ nhà Lugwin không?`},
  {en:`The big one had a thing for you, didn't she?`,ph:`ðə bɪɡ wʌn hæd ə θɪŋ fɔːr juː, ˈdɪdnt ʃiː?`,vi:`Đứa lớn để ý đến con nhỉ?`},
  {en:`They all had a thing for him.`,ph:`ðeɪ ɔːl hæd ə θɪŋ fɔːr hɪm.`,vi:`Họ đều để ý đến thằng bé.`},
  {en:`Oh, Mom.`,ph:`oʊ, mɒm.`,vi:`Ôi, mẹ.`},
  {en:`I'm sorry. Why is this girl going to call me?`,ph:`aɪm ˈsɒri. waɪ ɪz ðɪs ɡɜːrl ˈɡoʊɪŋ tuː kɔːl miː?`,vi:`Con xin lỗi. Sao cô ấy lại sắp gọi cho con?`},
  {en:`Oh, she just graduated, and she wants to be something in cooking or food...`,ph:`oʊ, ʃiː dʒʌst ˈɡrædʒueɪtɪd, ænd ʃiː wɒnts tuː biː ˈsʌmθɪŋ ɪn ˈkʊkɪŋ ɔːr fuːd...`,vi:`Ồ, con bé vừa tốt nghiệp, và muốn làm về nấu ăn, hoặc ẩm thực, hay...`},
  {en:`Or I don't know.`,ph:`ɔːr aɪ doʊnt noʊ.`,vi:`Mẹ không biết.`},
  {en:`Anyway, I told her you had a restaurant, so...`,ph:`ˈɛniˌweɪ, aɪ toʊld hɜːr juː hæd ə ˈrɛstəˌrɑːnt, soʊ...`,vi:`Dù sao mẹ cũng bảo nó là con có nhà hàng...`},
  {en:`No, Mom. I don't have a restaurant. I work in a restaurant.`,ph:`noʊ, mɒm. aɪ doʊnt hæv ə ˈrɛstəˌrɑːnt. aɪ wɜːrk ɪn ə ˈrɛstəˌrɑːnt.`,vi:`Không, mẹ à, con không có nhà hàng. Con làm ở nhà hàng.`},
  {en:`Well, they don't have to know that.`,ph:`wɛl, ðeɪ doʊnt hæv tuː noʊ ðæt.`,vi:`Họ đâu cần biết chuyện đó.`},
  {en:`Ross, could you come and help me with the spaghetti.`,ph:`rɒs, kʊd juː kʌm ænd hɛlp miː wɪð ðə spəˈɡɛti.`,vi:`Ross, anh đến đây giúp em làm món mì spaghetti được chứ?`},
  {en:`I know this is going to sound unbelievably selfish on my part...`,ph:`aɪ noʊ ðɪs ɪz ˈɡoʊɪŋ tuː saʊnd ˌʌnbɪˈliːvəbli ˈsɛlfɪʃ ɒn maɪ pɑːrt...`,vi:`Em biết em đang tỏ ra vô cùng ích kỷ,`},
  {en:`But were you planning on bringing up the whole baby/lesbian thing?`,ph:`bʌt wɜːr juː ˈplænɪŋ ɒn ˈbrɪŋɪŋ ʌp ðə hoʊl ˈbeɪbi/ˈlɛzbiən θɪŋ?`,vi:`nhưng anh có định nói về vụ đứa bé và đồng tính nữ không?`},
  {en:`Because I think it might take some of the heat off me.`,ph:`bɪˈkəz aɪ θɪŋk ɪt maɪt teɪk sʌm ɒv ðə hiːt ɔːf miː.`,vi:`Vì em nghĩ như thế sẽ khiến em bớt áp lực.`},
  {en:`What that Rachel did to her life. We ran into her parents at the club.`,ph:`wɒt ðæt ˈreɪtʃəl dɪd tuː hɜːr laɪf. wiː ræn ˈɪntuː hɜːr ˈpɛərənts æt ðə klʌb.`,vi:`Chuyện Rachel gây ra cho đời mình... Bố mẹ gặp bố mẹ nó ở câu lạc bộ.`},
  {en:`They were not playing very well.`,ph:`ðeɪ wɜːr nɒt ˈpleɪɪŋ ˈvɛri wɛl.`,vi:`Họ không được vui vẻ cho lắm.`},
  {en:`I'm not gonna tell you what they spent on that wedding...`,ph:`aɪm nɒt ˈɡɒnə tɛl juː wɒt ðeɪ spɛnt ɒn ðæt ˈwɛdɪŋ...`,vi:`Bố sẽ không nói ra họ đã chi bao nhiêu cho đám cưới đâu,`},
  {en:`But $40,000 is a lot of money.`,ph:`bʌt fɔːrti ˈθaʊzənd ˈdɒlərz ɪz ə lɒt ɒv ˈmʌni.`,vi:`nhưng 40.000 đô la là số tiền lớn đấy.`},
  {en:`Well, at least she had the chance to leave a man at the altar.`,ph:`wɛl, æt liːst ʃiː hæd ðə tʃæns tuː liːv ə mæn æt ðə ˈɔːltər.`,vi:`Chà, ít ra con bé đã có cơ hội bỏ một gã ở lễ cưới.`},
  {en:`What's that supposed to mean?`,ph:`wɒts ðæt səˈpoʊzd tuː miːn?`,vi:`Thế là ý gì vậy mẹ?`},
  {en:`Nothing.`,ph:`ˈnʌθɪŋ.`,vi:`Không có gì cả.`},
  {en:`It's an expression.`,ph:`ɪts ən ɪkˈsprɛʃən.`,vi:`Một cách diễn đạt thôi.`},
  {en:`No, it's not.`,ph:`noʊ, ɪts nɒt.`,vi:`Không đâu mẹ.`},
  {en:`Don't listen to your mother.`,ph:`doʊnt ˈlɪsən tuː jʊər ˈmʌðər.`,vi:`Đừng nghe lời mẹ con.`},
  {en:`You're independent and you always have been.`,ph:`jʊər ˌɪndɪˈpɛndənt ænd juː ˈɔːlweɪz hæv biːn.`,vi:`Con rất độc lập, và lúc nào cũng vậy.`},
  {en:`Even when you were a kid, and you were chubby...`,ph:`ˈiːvən wɛn juː wɜːr ə kɪd, ænd juː wɜːr ˈtʃʌbi...`,vi:`Kể cả khi con còn nhỏ, lúc con béo mũm mĩm và không có bạn,`},
  {en:`And you had no friends, you were just fine.`,ph:`ænd juː hæd noʊ frɛndz, juː wɜːr dʒʌst faɪn.`,vi:`con cũng vẫn ổn đó thôi.`},
  {en:`You'd read alone in your room. And your puzzles...`,ph:`juːd riːd əˈloʊn ɪn jʊər ruːm. ænd jʊər ˈpʌzəlz...`,vi:`Con đọc sách một mình trong phòng và chơi xếp hình...`},
  {en:`Look, there are people, like Ross, who need to shoot for the stars.`,ph:`lʊk, ðeər ɑːr ˈpiːpəl, laɪk rɒs, huː niːd tuː ʃuːt fɔːr ðə stɑːrz.`,vi:`Nghe này, có những người như Ross cần vươn tới những cơ hội lớn,`},
  {en:`With his museum and his papers getting published.`,ph:`wɪð hɪz mjuˈziːəm ænd hɪz ˈpeɪpərz ˈɡɛtɪŋ ˈpʌblɪʃt.`,vi:`với bảo tàng và luận án sắp ra mắt.`},
  {en:`Other people are satisfied with staying where they are.`,ph:`ˈʌðər ˈpiːpəl ɑːr ˈsætɪsˌfaɪd wɪð ˈsteɪɪŋ wɛər ðeɪ ɑːr.`,vi:`Người khác lại hài lòng với những gì họ có được.`},
  {en:`I'm telling you, these are the people who never get cancer.`,ph:`aɪm ˈtɛlɪŋ juː, ðiːz ɑːr ðə ˈpiːpəl huː ˈnɛvər ɡɛt ˈkænsər.`,vi:`Bố nói này, người như vậy không bao giờ bị ung thư.`},
  {en:`And I read about these women trying to have it all, and I thank God...`,ph:`ænd aɪ riːd əˈbaʊt ðiːz ˈwɪmɪn ˈtraɪɪŋ tuː hæv ɪt ɔːl, ænd aɪ θæŋk ɡɒd...`,vi:`Và bố cũng đọc về những phụ nữ muốn có tất cả,`},
  {en:`Our little Harmonica doesn't seem to have that problem.`,ph:`ˈaʊər ˈlɪtəl hɑːrˈmɒnɪkə ˈdʌzənt siːm tuː hæv ðæt ˈprɒbləm.`,vi:`và bố tạ ơn Chúa là Harmonica bé nhỏ của chúng ta không gặp vấn đề đó.`},
  {en:`So, Ross, what's going on with you?`,ph:`soʊ, rɒs, wɒts ˈɡoʊɪŋ ɒn wɪð juː?`,vi:`Vậy Ross, anh có chuyện gì vậy?`},
  {en:`Any stories? No news, no little anecdotes to share with the folks?`,ph:`ˈɛni ˈstɔːriz? noʊ njuːz, noʊ ˈlɪtəl ˈænɪkˌdoʊts tuː ʃɛr wɪð ðə foʊks?`,vi:`Có chuyện gì không? Không có tin hay chuyện vặt nào để kể với bố mẹ sao?`},
  {en:`Okay, okay.`,ph:`oʊˈkeɪ, oʊˈkeɪ.`,vi:`Được rồi.`},
  {en:`Ahem. Look, I, uh... I realize you guys have been wondering...`,ph:`əˈhɛm. lʊk, aɪ, ʌ... aɪ ˈriːəˌlaɪz juː ɡaɪz hæv biːn ˈwʌndərɪŋ...`,vi:`Này, con thấy bố mẹ vẫn băn khoăn`},
  {en:`What exactly happened between Carol and me.`,ph:`wɒt ɪɡˈzæktli ˈhæpənd bɪˈtwiːn ˈkærəl ænd miː.`,vi:`về việc có chuyện gì xảy ra giữa con và Carol.`},
  {en:`And so, well, here's the deal.`,ph:`ænd soʊ, wɛl, hɪərz ðə diːl.`,vi:`Và chuyện là thế này.`},
  {en:`Carol's a lesbian.`,ph:`ˈkærəlz ə ˈlɛzbiən.`,vi:`Carol là đồng tính nữ.`},
  {en:`She's living with a woman named Susan.`,ph:`ʃiːz ˈlɪvɪŋ wɪð ə ˈwʊmən neɪmd ˈsuːzən.`,vi:`Cô ấy đang sống với một người phụ nữ tên Susan.`},
  {en:`She's pregnant with my child.`,ph:`ʃiːz ˈprɛɡnənt wɪð maɪ tʃaɪld.`,vi:`Cô ấy đang mang thai con của con,`},
  {en:`And she and Susan are going to raise the baby.`,ph:`ænd ʃiː ænd ˈsuːzən ɑːr ˈɡoʊɪŋ tuː reɪz ðə ˈbeɪbi.`,vi:`cô ấy và Susan sẽ nuôi đứa bé.`},
  {en:`And you knew about this?`,ph:`ænd juː nuː əˈbaʊt ðɪs?`,vi:`Và con biết chuyện đó sao?`},
  {en:`Your folks are really that bad, huh?`,ph:`jʊər foʊks ɑːr ˈrɪli ðæt bæd, hʌ?`,vi:`Bố mẹ hai cậu tệ vậy sao?`},
  {en:`Well, you know, these people are pros.`,ph:`wɛl, juː noʊ, ðiːz ˈpiːpəl ɑːr proʊz.`,vi:`Chà, cậu biết đấy, họ rất chuyên nghiệp.`},
  {en:`They know what they're doing. They take their time.`,ph:`ðeɪ noʊ wɒt ðeər ˈduːɪŋ. ðeɪ teɪk ðeər taɪm.`,vi:`Họ biết mình đang làm gì. Họ rất thư thả.`},
  {en:`They get the job done.`,ph:`ðeɪ ɡɛt ðə dʒɒb dʌn.`,vi:`Và họ giải quyết xong việc.`},
  {en:`Boy, I know they say that you can't change your parents.`,ph:`bɔɪ, aɪ noʊ ðeɪ seɪ ðæt juː kænt tʃeɪndʒ jʊər ˈpɛərənts.`,vi:`Ôi, em biết người ta nói bạn không thể thay đổi bố mẹ.`},
  {en:`Boy, if you could, I'd want yours.`,ph:`bɔɪ, ɪf juː kʊd, aɪd wɒnt jʊərz.`,vi:`Nhưng nếu được, em muốn có bố mẹ anh.`},
  {en:`Must pee.`,ph:`mʌst piː.`,vi:`Tôi phải đi tiểu.`},
  {en:`You know, it's even worse when you're twins.`,ph:`juː noʊ, ɪts ˈiːvən wɜːrs wɛn jʊər twɪnz.`,vi:`Này, là con sinh đôi còn tệ hơn.`},
  {en:`You're a twin?`,ph:`jʊər ə twɪn?`,vi:`Cậu là con sinh đôi?`},
  {en:`Oh, yeah. We don't speak.`,ph:`oʊ, jæ. wiː doʊnt spiːk.`,vi:`Vâng. Bọn tôi không nói chuyện.`},
  {en:`She's like this high-powered, driven, career-type.`,ph:`ʃiːz laɪk ðɪs haɪ-ˈpaʊərd, ˈdrɪvən, kəˈrɪr-taɪp.`,vi:`Chị ta là kiểu người quyền lực, tập trung vào sự nghiệp.`},
  {en:`What does she do?`,ph:`wɒt dʌz ʃiː duː?`,vi:`Cô ấy làm gì?`},
  {en:`She's a waitress.`,ph:`ʃiːz ə ˈweɪtrɪs.`,vi:`Chị ta là bồi bàn.`},
  {en:`All right. You guys, I kind of gotta clean up now.`,ph:`ɔːl raɪt. juː ɡaɪz, aɪ kaɪnd ɒv ˈɡɒtə kliːn ʌp naʊ.`,vi:`Được rồi, các cậu, giờ tôi phải dọn dẹp đây.`},
  {en:`Chandler, you're an only child, right? You don't have any of this.`,ph:`ˈtʃændlər, jʊər ən ˈoʊnli tʃaɪld, raɪt? juː doʊnt hæv ˈɛni ɒv ðɪs.`,vi:`Chandler, cậu là con một nhỉ? Cậu không bị thế này.`},
  {en:`Well, no, although I did have an imaginary friend...`,ph:`wɛl, noʊ, ɔːlˈðoʊ aɪ dɪd hæv ən ɪˈmædʒəˌnɛri frɛnd...`,vi:`Ồ, không, mặc dù tôi cũng có một người bạn tưởng tượng`},
  {en:`Who my parents actually preferred.`,ph:`huː maɪ ˈpɛərənts ˈæktʃuəli prɪˈfɜːrd.`,vi:`được bố mẹ tôi quý hơn.`},
  {en:`Hit the lights, please.`,ph:`hɪt ðə laɪts, pliːz.`,vi:`Tắt đèn giúp tôi.`},
  {en:`How long was I in there?`,ph:`haʊ lɒŋ wɒz aɪ ɪn ðɛər?`,vi:`Tôi vào bao lâu rồi?`},
  {en:`I'm just cleaning up.`,ph:`aɪm dʒʌst ˈkliːnɪŋ ʌp.`,vi:`Tôi chỉ đang dọn thôi.`},
  {en:`Oh, do you, uh...? Do you need any help?`,ph:`oʊ, duː juː, ʌ...? duː juː niːd ˈɛni hɛlp?`,vi:`Ồ, cậu cần giúp không?`},
  {en:`Um, okay, sure. Thanks.`,ph:`ʌm, oʊˈkeɪ, ʃʊr. θæŋks.`,vi:`Được, tất nhiên rồi. Cảm ơn.`},
  {en:`Anyway...`,ph:`ˈɛniˌweɪ...`,vi:`Dù sao thì...`},
  {en:`So you nervous about Barry tomorrow?`,ph:`soʊ juː ˈnɜːrvəs əˈbaʊt ˈbæri təˈmɒroʊ?`,vi:`Vậy cậu lo về chuyện Barry ngày mai sao?`},
  {en:`Oh, a little.`,ph:`oʊ, ə ˈlɪtəl.`,vi:`Một chút.`},
  {en:`Mm-hm.`,ph:`mm-hm.`,vi:`Vâng.`},
  {en:`A lot.`,ph:`ə lɒt.`,vi:`Rất nhiều.`},
  {en:`Mm-hm.`,ph:`mm-hm.`,vi:`Vâng.`},
  {en:`So got any advice?`,ph:`soʊ ɡɒt ˈɛni ədˈvaɪs?`,vi:`Vậy cậu có lời khuyên nào không?`},
  {en:`You know, as someone who's recently been dumped.`,ph:`juː noʊ, æz ˈsʌmˌwʌn huːz ˈriːsəntli biːn dʌmpt.`,vi:`Cậu biết đấy, với tư cách một người vừa bị đá.`},
  {en:`Well, you may want to steer clear of the word "dumped."`,ph:`wɛl, juː meɪ wɒnt tuː stɪər klɪər ɒv ðə wɜːrd "dʌmpt."`,vi:`Ồ, có lẽ cậu muốn tránh dùng từ "đá" đấy.`},
  {en:`Chances are he's going to be this broken shell of a man. You know?`,ph:`ˈtʃænsɪz ɑːr hiːz ˈɡoʊɪŋ tuː biː ðɪs ˈbroʊkən ʃɛl ɒv ə mæn. juː noʊ?`,vi:`Có thể anh ta sẽ rất đau khổ, cậu biết chứ?`},
  {en:`So you should try not to look too terrific. I know it'll be hard.`,ph:`soʊ juː ʃʊd traɪ nɒt tuː lʊk tuː təˈrɪfɪk. aɪ noʊ ɪtəl biː hɑːrd.`,vi:`Vậy cậu nên cố đừng trông quá đẹp. Tôi biết là sẽ rất khó.`},
  {en:`Or, you know, hey, I'll go down there, and I'll give Barry back his ring.`,ph:`ɔːr, juː noʊ, heɪ, aɪl ɡoʊ daʊn ðɛər, ænd aɪl ɡɪv ˈbæri bæk hɪz rɪŋ.`,vi:`Này, tôi có thể đến đó và trả nhẫn lại cho Barry.`},
  {en:`And you can go with Carol and Susan to the OB-GYN.`,ph:`ænd juː kæn ɡoʊ wɪð ˈkærəl ænd ˈsuːzən tuː ði oʊ-bi-dʒi-waɪ-ɛn.`,vi:`Còn cậu có thể đến phòng khám phụ sản cùng Carol và Susan.`},
  {en:`You've got Carol tomorrow.`,ph:`jʊv ɡɒt ˈkærəl təˈmɒroʊ.`,vi:`Mai cậu vướng chuyện Carol rồi.`},
  {en:`When did it get so complicated?`,ph:`wɛn dɪd ɪt ɡɛt soʊ ˈkɒmplɪˌkeɪtɪd?`,vi:`Từ bao giờ mà chuyện này phức tạp vậy?`},
  {en:`Got me.`,ph:`ɡɒt miː.`,vi:`Tôi khổ quá mà.`},
  {en:`Remember when we were in high school?`,ph:`rɪˈmɛmbər wɛn wiː wɜːr ɪn haɪ skuːl?`,vi:`Nhớ hồi ta cùng học trung học không?`},
  {en:`Yeah.`,ph:`jæ.`,vi:`Có.`},
  {en:`I mean, didn't you think you' were gonna meet someone...`,ph:`aɪ miːn, ˈdɪdnt juː θɪŋk juː wɜːr ˈɡɒnə miːt ˈsʌmˌwʌn...`,vi:`Ý tôi là, chẳng phải cậu cho rằng cậu sẽ chỉ gặp một người,`},
  {en:`Fall in love, and that'd be it?`,ph:`fɔːl ɪn lʌv, ænd ðætd biː ɪt?`,vi:`yêu người đó và vậy là xong sao?`},
  {en:`Ross?`,ph:`rɒs?`,vi:`Ross?`},
  {en:`Yes, yes.`,ph:`jɛs, jɛs.`,vi:`Phải.`},
  {en:`Oh. Man. I never thought I'd be here.`,ph:`oʊ. mæn. aɪ ˈnɛvər θɔːt aɪd biː hɪər.`,vi:`Ôi, tôi chưa từng nghĩ mình sẽ thế này.`},
  {en:`Me neither.`,ph:`miː ˈniːðər.`,vi:`Tôi cũng vậy.`},
  {en:`Hi. Sorry I'm late. I got stuck at work.`,ph:`haɪ. ˈsɒri aɪm leɪt. aɪ ɡɒt stʌk æt wɜːrk.`,vi:`Chào. Xin lỗi vì đến muộn. Anh kẹt việc.`},
  {en:`There was this big dinosaur thing. Anyway...`,ph:`ðeər wɒz ðɪs bɪɡ ˈdaɪnəˌsɔːr θɪŋ. ˈɛniˌweɪ...`,vi:`Có chuyện lớn với khủng long. Dù sao thì...`},
  {en:`Hi.`,ph:`haɪ.`,vi:`Chào.`},
  {en:`Ross, you remember Susan.`,ph:`rɒs, juː rɪˈmɛmbər ˈsuːzən.`,vi:`Ross, anh nhớ Susan chứ?`},
  {en:`How could I forget?`,ph:`haʊ kʊd aɪ fərˈɡɛt?`,vi:`Sao anh quên được?`},
  {en:`Ross.`,ph:`rɒs.`,vi:`Ross.`},
  {en:`Hello, Susan. Good shake, good shake.`,ph:`həˈloʊ, ˈsuːzən. ɡʊd ʃeɪk, ɡʊd ʃeɪk.`,vi:`Chào, Susan. Bắt tay chặt đấy.`},
  {en:`So, uh, we're just waiting for?`,ph:`soʊ, ʌ, wɪər dʒʌst ˈweɪtɪŋ fɔːr?`,vi:`Vậy, ta đang chờ...`},
  {en:`Dr. Oberman.`,ph:`ˈdɒktər ˈoʊbərmən.`,vi:`Bác sĩ Oberman.`},
  {en:`Dr. Oberman. Okay, and is he...?`,ph:`ˈdɒktər ˈoʊbərmən. oʊˈkeɪ, ænd ɪz hiː...?`,vi:`Bác sĩ Oberman. Ừ, và anh ấy...`},
  {en:`She.`,ph:`ʃiː.`,vi:`Cô ấy.`},
  {en:`Of course, "she."`,ph:`ɒv kɔːrs, "ʃiː."`,vi:`Cô ấy. Hẳn rồi.`},
  {en:`She, uh, familiar with our special situation?`,ph:`ʃiː, ʌ, fəˈmɪliər wɪð ˈaʊər ˈspɛʃəl ˌsɪtjuˈeɪʃən?`,vi:`Cô ấy có biết tình huống đặc biệt của chúng ta không?`},

  {en:`Great. Okay, that's great. Heh.`,ph:`ɡreɪt. oʊˈkeɪ, ðæts ɡreɪt. hɛ.`,vi:`Tuyệt! Được, rất tốt.`},

  {en:`Be right there. I'll be back in a second.`,ph:`biː raɪt ðɛər. aɪl biː bæk ɪn ə ˈsɛkənd.`,vi:`Tôi tới ngay. Sẽ quay lại ngay.`},

  {en:`You know, when, like, important decisions have to be made?`,ph:`juː noʊ, wɛn, laɪk, ɪmˈpɔːrtənt dɪˈsɪʒənz hæv tuː biː meɪd?`,vi:`Em biết đấy, khi cần đưa ra quyết định quan trọng ấy?`},
  {en:`Give me a "for instance."`,ph:`ɡɪv miː ə "fɔːr ˈɪnstəns."`,vi:`Cho em một ví dụ đi.`},
  {en:`Well, I don't know. Okay, okay.`,ph:`wɛl, aɪ doʊnt noʊ. oʊˈkeɪ, oʊˈkeɪ.`,vi:`Ồ, anh không biết. Được rồi.`},
  {en:`How about with the baby's name?`,ph:`haʊ əˈbaʊt wɪð ðə ˈbeɪbiz neɪm?`,vi:`Về tên của đứa bé thì sao?`},
  {en:`Marlon...`,ph:`ˈmɑːrlən...`,vi:`Marlon...`},
  {en:`Marlon. ...if it's a boy. Minnie, if it's a girl.`,ph:`ˈmɑːrlən. ...ɪf ɪts ə bɔɪ. ˈmɪni, ɪf ɪts ə ɡɜːrl.`,vi:`Marlon. ...nếu nó là con trai. Minnie, nếu nó là con gái.`},
  {en:`As in "Mouse"?`,ph:`æz ɪn "maʊs"?`,vi:`Như tên chuột "Mouse" à?`},
  {en:`As in my grandmother.`,ph:`æz ɪn maɪ ˈɡrændˌmʌðər.`,vi:`Như trong tên bà em.`},
  {en:`Still, you say "Minnie," you hear "Mouse."`,ph:`stɪl, juː seɪ "ˈmɪni," juː hɪər "maʊs."`,vi:`Dù sao thì khi em nói Minnie, em sẽ nghe thấy "Mouse".`},
  {en:`How about, um... How about "Julia"?`,ph:`haʊ əˈbaʊt, ʌ... haʊ əˈbaʊt "ˈdʒuːliə"?`,vi:`Vậy còn... Vậy còn Julia?`},
  {en:`We agreed on Minnie.`,ph:`wiː əˈɡriːd ɒn ˈmɪni.`,vi:`Bọn tôi đồng ý chọn tên Minnie rồi.`},
  {en:`It's funny, um, we agreed we'd spend our lives together.`,ph:`ɪts ˈfʌni, ʌm, wiː əˈɡriːd wiːd spɛnd ˈaʊər laɪvz təˈɡɛðər.`,vi:`Buồn cười thật. Ta đã đồng ý sẽ bên nhau trọn đời.`},
  {en:`Things change. Roll with the punches.`,ph:`θɪŋz tʃeɪndʒ. roʊl wɪð ðə ˈpʌntʃɪz.`,vi:`Mọi thứ đều thay đổi. Thích nghi đi.`},
  {en:`I believe Julia's on the table.`,ph:`aɪ bɪˈliːv ˈdʒuːliəz ɒn ðə ˈteɪbəl.`,vi:`Anh thấy nên cân nhắc tên Julia.`},
  {en:`Oh. Sorry about that.`,ph:`oʊ. ˈsɒri əˈbaʊt ðæt.`,vi:`Anh xin lỗi.`},
  {en:`So, what have you been up to?`,ph:`soʊ, wɒt hæv juː biːn ʌp tuː?`,vi:`Vậy...em đang làm gì?`},
  {en:`Oh. Not much.`,ph:`oʊ. nɒt mʌtʃ.`,vi:`Không nhiều lắm.`},
  {en:`I got a job.`,ph:`aɪ ɡɒt ə dʒɒb.`,vi:`Em có việc làm rồi.`},
  {en:`Hey, that's great.`,ph:`heɪ, ðæts ɡreɪt.`,vi:`Ồ, thật tuyệt!`},
  {en:`Why are you so tan?`,ph:`waɪ ɑːr juː soʊ tæn?`,vi:`Sao da anh rám nắng thế?`},
  {en:`Oh, I, uh... I went to Aruba.`,ph:`oʊ, aɪ, ʌ... aɪ wɛnt tuː əˈruːbə.`,vi:`Anh đã đi Aruba.`},
  {en:`Oh, no. You went on our honeymoon alone?`,ph:`oʊ, noʊ. juː wɛnt ɒn ˈaʊər ˈhʌniˌmuːn əˈloʊn?`,vi:`Ôi, không. Anh đi trăng mật của ta một mình ư?`},
  {en:`No. I went with Mindy.`,ph:`noʊ. aɪ wɛnt wɪð ˈmɪndi.`,vi:`Không. Anh đi cùng Mindy.`},
  {en:`My maid of honor, Mindy?`,ph:`maɪ meɪd ɒv ˈɒnər, ˈmɪndi?`,vi:`Phù dâu chính của em, Mindy ư?`},
  {en:`Yeah, well, we're kind of a thing now.`,ph:`jæ, wɛl, wɪər kaɪnd ɒv ə θɪŋ naʊ.`,vi:`Phải, ồ...Bọn anh đang ở bên nhau.`},
  {en:`You got plugs.`,ph:`juː ɡɒt plʌɡz.`,vi:`Anh cấy tóc này!`},
  {en:`Careful, careful. They haven't quite taken yet.`,ph:`ˈkɛrfʊl, ˈkɛrfʊl. ðeɪ ˈhævənt kwaɪt ˈteɪkən jɛt.`,vi:`Cẩn thận. Chưa ổn hẳn đâu.`},
  {en:`And you got lenses.`,ph:`ænd juː ɡɒt ˈlɛnzɪz.`,vi:`Anh còn đeo kính áp tròng nữa.`},
  {en:`But you hate sticking your finger in your eye.`,ph:`bʌt juː heɪt ˈstɪkɪŋ jʊər ˈfɪŋɡər ɪn jʊər aɪ.`,vi:`Anh ghét chọc tay vào mắt mà.`},
  {en:`Not for her.`,ph:`nɒt fɔːr hɜːr.`,vi:`Vì cô ấy thì không.`},
  {en:`Listen, I really wanted to thank you.`,ph:`ˈlɪsən, aɪ ˈrɪli ˈwɒntɪd tuː θæŋk juː.`,vi:`Nghe này, anh thật sự muốn cảm ơn em.`},
  {en:`Okay. About a month ago, I wanted to hurt you...`,ph:`oʊˈkeɪ. əˈbaʊt ə mʌnθ əˈɡoʊ, aɪ ˈwɒntɪd tuː hɜːrt juː...`,vi:`Được rồi. Khoảng một tháng trước, anh đã muốn làm tổn thương em`},
  {en:`More than I've ever wanted to hurt anyone in my life.`,ph:`mɔːr ðæn aɪv ˈɛvər ˈwɒntɪd tuː hɜːrt ˈɛniˌwʌn ɪn maɪ laɪf.`,vi:`hơn bất cứ ai anh từng muốn làm tổn thương trong đời.`},
  {en:`And I'm an orthodontist.`,ph:`ænd aɪm ən ˌɔːrθəˈdɒntɪst.`,vi:`Mà anh là nha sĩ chỉnh hình đấy.`},
  {en:`You know, you were right. I mean, I thought we were happy.`,ph:`juː noʊ, juː wɜːr raɪt. aɪ miːn, aɪ θɔːt wiː wɜːr ˈhæpi.`,vi:`Em biết đấy, em đã đúng. Anh tưởng ta đã hạnh phúc.`},
  {en:`We weren't happy. But with Mindy... now I'm happy.`,ph:`wiː ˈwɜːrnt ˈhæpi. bʌt wɪð ˈmɪndi... naʊ aɪm ˈhæpi.`,vi:`Nhưng không phải. Nhưng với Mindy... Giờ anh rất hạnh phúc.`},
  {en:`Spit.`,ph:`spɪt.`,vi:`Nhổ ra đi.`},
  {en:`What?`,ph:`wɒt?`,vi:`Sao?`},
  {en:`Anyway, um... I guess, uh... I guess this belongs to you.`,ph:`ˈɛniˌweɪ, ʌm... aɪ ɡɛs, ʌ... aɪ ɡɛs ðɪs bɪˈlɔːŋz tuː juː.`,vi:`Dù sao thì... Em nghĩ thứ này là của anh.`},
  {en:`And thank you for giving it to me.`,ph:`ænd θæŋk juː fɔːr ˈɡɪvɪŋ ɪt tuː miː.`,vi:`Và cảm ơn anh đã trao nó cho em.`},
  {en:`Well, thank you for giving it back.`,ph:`wɛl, θæŋk juː fɔːr ˈɡɪvɪŋ ɪt bæk.`,vi:`À thì, cảm ơn em đã trả lại nó.`},
  {en:`Hello.`,ph:`həˈloʊ.`,vi:`Này?`},
  {en:`Oh, please. What's wrong with Helen?`,ph:`oʊ, pliːz. wɒt s rɒŋ wɪð ˈhɛlən?`,vi:`Ồ, thôi nào. Helen thì sao chứ?`},
  {en:`I don't think so. Hello, it's not gonna be Helen Geller.`,ph:`aɪ doʊnt θɪŋk soʊ. həˈloʊ, ɪts nɒt ˈɡɒnə biː ˈhɛlən ˈɡɛlər.`,vi:`Anh không nghĩ vậy. Này? Sẽ không phải là Helen Geller đâu.`},
  {en:`Thank you.`,ph:`θæŋk juː.`,vi:`Cảm ơn em.`},
  {en:`No. I mean, it's not Geller.`,ph:`noʊ. aɪ miːn, ɪts nɒt ˈɡɛlər.`,vi:`Không. Ý em là không phải Geller.`},
  {en:`What, it's gonna be Helen Willick?`,ph:`wɒt, ɪts ˈɡɒnə biː ˈhɛlən ˈwɪlɪk?`,vi:`Sao? Vậy là Helen Willick ư?`},
  {en:`No, actually, um, we talked about Helen Willick Bunch.`,ph:`noʊ, ˈæktʃuəli, ʌm, wiː tɔːkt əˈbaʊt ˈhɛlən ˈwɪlɪk bʌntʃ.`,vi:`Không, thật ra bọn em đã bàn là Helen Willick-Bunch.`},
  {en:`Well, wait a minute. Why is she in the title?`,ph:`wɛl, weɪt ə ˈmɪnɪt. waɪ ɪz ʃiː ɪn ðə ˈtaɪtəl?`,vi:`Ồ, khoan đã. Sao lại có cả họ cô ta?`},
  {en:`Because it's my baby too.`,ph:`bɪˈkəz ɪts maɪ ˈbeɪbi tuː.`,vi:`Vì đứa bé cũng là con tôi.`},
  {en:`That's funny. Really? I don't remember you making any sperm.`,ph:`ðæts ˈfʌni. ˈrɪli? aɪ doʊnt rɪˈmɛmbər juː ˈmeɪkɪŋ ˈɛni spɜːrm.`,vi:`Thật sao? Tôi không nhớ cô cũng tạo ra tinh trùng.`},
  {en:`And we all know what a challenge that is.`,ph:`ænd wiː ɔːl noʊ wɒt ə ˈtʃælɪndʒ ðæt ɪz.`,vi:`Và ta đều biết đó là cả một thử thách.`},
  {en:`All right, you two, stop it.`,ph:`ɔːl raɪt, juː tuː, stɒp ɪt.`,vi:`Được rồi, hai người. Thôi đi.`},
  {en:`No, no. She gets a credit. Hey, I'm in there too.`,ph:`noʊ, noʊ. ʃiː ɡɛts ə ˈkrɛdɪt. heɪ, aɪm ɪn ðɛər tuː.`,vi:`Cô ta được ghi nhận. Này, anh cũng có công đấy.`},
  {en:`Honestly. You're not actually suggesting Helen Willick Bunch Geller.`,ph:`ˈɒnəstli. jʊər nɒt ˈæktʃuəli səˈdʒɛstɪŋ ˈhɛlən ˈwɪlɪk bʌntʃ ˈɡɛlər.`,vi:`Ross, anh không định nói nên để tên là Helen Willick-Bunch-Geller chứ,`},
  {en:`I think that borders on child abuse.`,ph:`aɪ θɪŋk ðæt ˈbɔːrdərz ɒn tʃaɪld əˈbjuːz.`,vi:`vì em thấy như vậy là bạo hành trẻ em.`},
  {en:`Of course not. I'm suggesting Geller Willick Bunch.`,ph:`ɒv kɔːrs nɒt. aɪm səˈdʒɛstɪŋ ˈɡɛlər ˈwɪlɪk bʌntʃ.`,vi:`Tất nhiên là không. Anh nghĩ nên là Geller Willick Bunch.`},
  {en:`Oh, no. No, no, no. You see what he's doing?`,ph:`oʊ, noʊ. noʊ, noʊ, noʊ. juː siː wɒt hiz ˈduːɪŋ?`,vi:`Ồ không. Em thấy anh ta định làm gì chứ?`},
  {en:`He knows no one is gonna say all those names.`,ph:`hiː noʊz noʊ wʌn ɪz ˈɡɒnə seɪ ɔːl ðoʊz neɪmz.`,vi:`Anh ta biết chẳng ai gọi tên dài như thế.`},
  {en:`He knows they'll wind up calling her Geller. Then he gets his way.`,ph:`hiː noʊz ðeɪl waɪnd ʌp ˈkɔːlɪŋ hɜːr ˈɡɛlər. ðɛn hiː ɡɛts hɪz weɪ.`,vi:`Người ta sẽ gọi mỗi Geller thôi, vậy là hợp ý anh ta.`},
  {en:`My way? You think this is my way?`,ph:`maɪ weɪ? juː θɪŋk ðɪs ɪz maɪ weɪ?`,vi:`Ý tôi ư? Đây là ý tôi sao?`},
  {en:`Believe me, of all the ways I ever imagined this moment in my life being...`,ph:`bɪˈliːv miː, ɒv ɔːl ðə weɪz aɪ ˈɛvər ɪˈmædʒɪnd ðɪs ˈmoʊmənt ɪn maɪ laɪf ˈbiːɪŋ...`,vi:`Tin tôi đi. Trong tất cả viễn cảnh tôi tưởng tượng về khoảnh khắc này trong đời, tôi không hề có ý này.`},
  {en:`This is not my way. You know what? This is too hard.`,ph:`ðɪs ɪz nɒt maɪ weɪ. juː noʊ wɒt? ðɪs ɪz tuː hɑːrd.`,vi:`Em biết không? Việc này quá khó. Anh không thể làm...`},
  {en:`Knock, knock. How are we today? Any nausea?`,ph:`nɒk, nɒk. haʊ ɑːr wiː təˈdeɪ? ˈɛni ˈnɔːziə?`,vi:`Cốc cốc. Hôm nay sao rồi? Buồn nôn không?`},
  {en:`A little.`,ph:`ə ˈlɪtəl.`,vi:`Một chút.`},
  {en:`Just a little.`,ph:`dʒʌst ə ˈlɪtəl.`,vi:`Chỉ một chút.`},
  {en:`Well, I was just wondering about the mother-to-be, but, uh, thanks for sharing.`,ph:`wɛl, aɪ wɒz dʒʌst ˈwʌndərɪŋ əˈbaʊt ðə ˈmʌðər-tuː-biː, bʌt, ʌ, θæŋks fɔːr ˈʃɛrɪŋ.`,vi:`Vâng, thật ra...Ồ, tôi chỉ hỏi người mẹ tương lai thôi, nhưng cảm ơn đã chia sẻ.`},
  {en:`Lie back.`,ph:`laɪ bæk.`,vi:`Nằm xuống nào.`},
  {en:`You know what? I'm gonna go.`,ph:`juː noʊ wɒt? aɪm ˈɡɒnə ɡoʊ.`,vi:`Em biết không? Anh sẽ đi.`},
  {en:`Um, I don't think I can be involved in this particular family thing.`,ph:`ʌm, aɪ doʊnt θɪŋk aɪ kæn biː ɪnˈvɒlvd ɪn ðɪs pərˈtɪkjələr ˈfæməli θɪŋ.`,vi:`Anh không nghĩ mình có thể can dự vào chuyện gia đình này.`},
  {en:`Oh, my God.`,ph:`oʊ, maɪ ɡɒd.`,vi:`Ôi, Chúa ơi!`},
  {en:`Look at that.`,ph:`lʊk æt ðæt.`,vi:`Nhìn kìa.`},
  {en:`I know.`,ph:`aɪ noʊ.`,vi:`Em biết.`},
  {en:`Well, isn't that amazing?`,ph:`wɛl, ˈɪzənt ðæt əˈmeɪzɪŋ?`,vi:`Chà, chẳng phải rất tuyệt sao?`},
  {en:`What are we supposed to be seeing here?`,ph:`wɒt ɑːr wiː səˈpoʊzd tuː biː ˈsiːɪŋ hɪər?`,vi:`Bọn tôi đang phải xem gì vậy?`},
  {en:`I don't know, but I think it's about to attack the Enterprise.`,ph:`aɪ doʊnt noʊ, bʌt aɪ θɪŋk ɪts əˈbaʊt tuː əˈtæk ði ˈɛntərˌpraɪz.`,vi:`Tôi không biết, nhưng tôi nghĩ nó sắp tấn công tàu Enterprise.`},
  {en:`You know, if you tilt your head to the left and relax your eyes...`,ph:`juː noʊ, ɪf juː tɪlt jʊər hɛd tuː ðə lɛft ænd rɪˈlæks jʊər aɪz...`,vi:`Nghe này, nếu cậu nghiêng đầu sang trái và thả lỏng mắt,`},
  {en:`It kind of looks like an old potato.`,ph:`ɪt kaɪnd ɒv lʊks laɪk ən oʊld pəˈteɪtoʊ.`,vi:`nhìn nó hơi giống củ khoai tây già.`},
  {en:`Then don't do that, all right?`,ph:`ðɛn doʊnt duː ðæt, ɔːl raɪt?`,vi:`Vậy đừng làm thế, được chứ?`},
  {en:`Monica, what do you think?`,ph:`ˈmɒnɪkə, wɒt duː juː θɪŋk?`,vi:`Monica, em nghĩ sao?`},
  {en:`Mm-hm.`,ph:`mm-hm.`,vi:`Vâng.`},
  {en:`Are you welling up?`,ph:`ɑːr juː ˈwɛlɪŋ ʌp?`,vi:`Em xúc động chứ?`},
  {en:`No.`,ph:`noʊ.`,vi:`Không.`},
  {en:`You are.`,ph:`juː ɑːr.`,vi:`Có mà.`},
  {en:`You are. You're welling up.`,ph:`juː ɑːr. jʊər ˈwɛlɪŋ ʌp.`,vi:`Có đấy. Em xúc động kìa.`},

  {en:`You're gonna be an aunt.`,ph:`jʊər ˈɡɒnə biː ən ænt.`,vi:`Em sắp làm cô rồi.`},

  {en:`Hi, Mindy.`,ph:`haɪ, ˈmɪndi.`,vi:`Chào Mindy.`},

  {en:`I hope you two are very happy.`,ph:`aɪ hoʊp juː tuː ɑːr ˈvɛri ˈhæpi.`,vi:`Tôi mong hai người thật hạnh phúc.`},

  {en:`I just hope they have his old hairline and your old nose.`,ph:`aɪ dʒʌst hoʊp ðeɪ hæv hɪz oʊld ˈhɛərˌlaɪn ænd jʊər oʊld noʊz.`,vi:`mong bọn trẻ sẽ có tóc cũ của Barry và mũi cũ của cô.`},
  {en:`Okay, I know it was a cheap shot, but I feel so much better now.`,ph:`oʊˈkeɪ, aɪ noʊ ɪt wɒz ə tʃiːp ʃɒt, bʌt aɪ fiːl soʊ mʌtʃ ˈbɛtər naʊ.`,vi:`Rồi, tôi biết là thật hèn hạ nhưng giờ tôi thấy tốt hơn nhiều rồi.`}
];
// ==================== KẾT THÚC ENTRIES ====================

let noteData = []; 
let curColor = 0; 
let autoSaveTimeout = null;
let currentActiveId = null;
let isClearHlMode = false;
let isNoteMode = false;
let selectionTimeout = null;

const STORAGE_KEY = 'friends_ep2_v1';

function buildContent() {
  const container = document.getElementById('content');
  container.innerHTML = '';
  entries.forEach((entry, idx) => {
    const entryDiv = document.createElement('div');
    entryDiv.className = 'entry';
    
    const enDiv = document.createElement('div');
    enDiv.className = 'en-row';
    const enSpan = document.createElement('span');
    enSpan.className = 'en-text';
    enSpan.textContent = entry.en;
    const controlsSpan = document.createElement('span');
    controlsSpan.className = 'row-controls';
    
    const ipaBtn = document.createElement('button');
    ipaBtn.textContent = 'IPA';
    ipaBtn.setAttribute('data-type', 'ipa');
    ipaBtn.setAttribute('data-entry', idx);
    const vieBtn = document.createElement('button');
    vieBtn.textContent = 'VIE';
    vieBtn.setAttribute('data-type', 'vie');
    vieBtn.setAttribute('data-entry', idx);
    controlsSpan.appendChild(ipaBtn);
    controlsSpan.appendChild(vieBtn);
    enDiv.appendChild(enSpan);
    enDiv.appendChild(controlsSpan);
    entryDiv.appendChild(enDiv);
    
    if (entry.ph) {
      const phRow = document.createElement('div');
      phRow.className = 'row-line ph-row';
      const phContent = document.createElement('div');
      phContent.className = 'line-content ph-content';
      phContent.textContent = `/${entry.ph}/`;
      phRow.appendChild(phContent);
      entryDiv.appendChild(phRow);
    }
    if (entry.vi) {
      const viRow = document.createElement('div');
      viRow.className = 'row-line vi-row';
      const viContent = document.createElement('div');
      viContent.className = 'line-content vi-content';
      viContent.textContent = entry.vi;
      viRow.appendChild(viContent);
      entryDiv.appendChild(viRow);
    }
    container.appendChild(entryDiv);
  });
  
  document.querySelectorAll('.row-controls button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const entryDiv = btn.closest('.entry');
      const type = btn.getAttribute('data-type');
      let targetRow = null;
      if (type === 'ipa') targetRow = entryDiv.querySelector('.ph-row');
      else if (type === 'vie') targetRow = entryDiv.querySelector('.vi-row');
      if (targetRow) {
        targetRow.classList.toggle('hidden-row');
        autoSave();
      }
    });
  });
}

function hideAllIpa() {
  document.querySelectorAll('.ph-row').forEach(row => row.classList.add('hidden-row'));
  document.getElementById('btnToggleAllIpa').textContent = 'Show All IPA';
  autoSave();
}
function showAllIpa() {
  document.querySelectorAll('.ph-row').forEach(row => row.classList.remove('hidden-row'));
  document.getElementById('btnToggleAllIpa').textContent = 'Hide All IPA';
  autoSave();
}
function hideAllVie() {
  document.querySelectorAll('.vi-row').forEach(row => row.classList.add('hidden-row'));
  document.getElementById('btnToggleAllVie').textContent = 'Show All Translations';
  autoSave();
}
function showAllVie() {
  document.querySelectorAll('.vi-row').forEach(row => row.classList.remove('hidden-row'));
  document.getElementById('btnToggleAllVie').textContent = 'Hide All Translations';
  autoSave();
}

function toggleGlobalIpa() {
  const btn = document.getElementById('btnToggleAllIpa');
  if (btn.textContent === 'Hide All IPA') hideAllIpa();
  else showAllIpa();
}
function toggleGlobalVie() {
  const btn = document.getElementById('btnToggleAllVie');
  if (btn.textContent === 'Hide All Translations') hideAllVie();
  else showAllVie();
}

function initColorPicker() {
  document.querySelectorAll('.color-picker .hbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelector('.color-picker .hbtn.active').classList.remove('active');
      btn.classList.add('active');
      curColor = parseInt(btn.dataset.color);
      if (isClearHlMode) toggleClearHlMode();
    });
  });
}

function toggleClearHlMode() {
  isClearHlMode = !isClearHlMode;
  const btn = document.getElementById('btnToggleClearHl');
  btn.classList.toggle('toggle-active', isClearHlMode);
  btn.textContent = isClearHlMode ? "🗑 Xóa Highlight [BẬT]" : "🗑 Xóa Highlight [Tắt]";
  if (isClearHlMode && isNoteMode) toggleNoteMode();
}

function toggleNoteMode() {
  isNoteMode = !isNoteMode;
  const btn = document.getElementById('btnToggleNoteMode');
  const toolbar = document.getElementById('mainToolbar');
  btn.classList.toggle('toggle-active', isNoteMode);
  btn.textContent = isNoteMode ? "📝 Ghi chú [BẬT]" : "📝 Ghi chú [Tắt]";
  if (isNoteMode) {
    toolbar.classList.add('note-mode-on');
    document.body.classList.add('toolbar-note-active');
    if (isClearHlMode) toggleClearHlMode();
  } else {
    toolbar.classList.remove('note-mode-on');
    document.body.classList.remove('toolbar-note-active');
  }
}

function attachMarkEvents(mark) {
  mark.addEventListener('click', (e) => {
    e.stopPropagation();
    openNotePopupForMark(mark);
  });
}

function openNotePopupForMark(targetMark) {
  currentActiveId = targetMark.dataset.noteId;
  const existingItem = noteData.find(n => n.id == currentActiveId);
  document.getElementById('modalQuote').textContent = `"${targetMark.textContent}"`;
  document.getElementById('modalText').value = existingItem ? existingItem.note : "";
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  if (currentActiveId) {
    const targetMark = document.querySelector(`mark[data-note-id="${currentActiveId}"]`);
    if (targetMark && !targetMark.classList.contains('has-note') && !targetMark.className.match(/c[0-4]/)) {
      const parent = targetMark.parentNode;
      while (targetMark.firstChild) parent.insertBefore(targetMark.firstChild, targetMark);
      parent.removeChild(targetMark);
    }
  }
  currentActiveId = null;
}

function executeRemoveHighlight(markNode) {
  const id = markNode.dataset.noteId;
  noteData = noteData.filter(n => n.id != id);
  const parent = markNode.parentNode;
  while (markNode.firstChild) parent.insertBefore(markNode.firstChild, markNode);
  parent.removeChild(markNode);
  renderNotesList();
  autoSave();
}

function saveNote() {
  const text = document.getElementById('modalText').value.trim();
  const targetMark = document.querySelector(`mark[data-note-id="${currentActiveId}"]`);
  if (targetMark) {
    if (text) {
      targetMark.classList.add('has-note');
      const existingIndex = noteData.findIndex(n => n.id == currentActiveId);
      if (existingIndex > -1) noteData[existingIndex].note = text;
      else noteData.push({ id: currentActiveId, quote: targetMark.textContent, note: text });
    } else {
      executeDeleteNoteInside();
      return;
    }
  }
  closeModal();
  renderNotesList();
  autoSave();
}

function executeDeleteNoteInside() {
  if (!currentActiveId) return;
  const targetMark = document.querySelector(`mark[data-note-id="${currentActiveId}"]`);
  if (targetMark) {
    targetMark.classList.remove('has-note');
    noteData = noteData.filter(n => n.id != currentActiveId);
    if (!targetMark.className.match(/c[0-4]/)) {
      const parent = targetMark.parentNode;
      while (targetMark.firstChild) parent.insertBefore(targetMark.firstChild, targetMark);
      parent.removeChild(targetMark);
    }
  }
  closeModal();
  renderNotesList();
  autoSave();
}

function renderNotesList() {
  const list = document.getElementById('notesList');
  document.getElementById('noteCount').textContent = noteData.length;
  if (noteData.length === 0) {
    list.innerHTML = '<div class="no-notes">Chưa có cụm từ ghi chú giải nghĩa nào.</div>';
    return;
  }
  list.innerHTML = noteData.map(n => `
    <div class="note-item">
      <span class="note-del" onclick="deleteNoteFromList('${n.id}')">🗑</span>
      <div class="note-text-quoted" onclick="locateAndHighlight('${n.id}')">"${n.quote}"</div>
      <div class="note-body" onclick="locateAndHighlight('${n.id}')">${n.note}</div>
    </div>
  `).join('');
}

window.deleteNoteFromList = function(id) {
  noteData = noteData.filter(n => n.id != id);
  const mark = document.querySelector(`mark[data-note-id="${id}"]`);
  if (mark) {
    mark.classList.remove('has-note');
    if (!mark.className.match(/c[0-4]/)) {
      const parent = mark.parentNode;
      while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
      parent.removeChild(mark);
    }
  }
  renderNotesList();
  autoSave();
};

window.locateAndHighlight = function(id) {
  const mark = document.querySelector(`mark[data-note-id="${id}"]`);
  if (mark) {
    mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
    mark.style.outline = '2px solid #2563eb';
    setTimeout(() => mark.style.outline = 'none', 1500);
  }
};

function autoSave() {
  clearTimeout(autoSaveTimeout);
  const ind = document.getElementById('saveInd');
  ind.classList.add('show');
  autoSaveTimeout = setTimeout(() => {
    const ipaHidden = Array.from(document.querySelectorAll('.ph-row')).map(r => r.classList.contains('hidden-row'));
    const vieHidden = Array.from(document.querySelectorAll('.vi-row')).map(r => r.classList.contains('hidden-row'));
    const payload = {
      ipaHidden,
      vieHidden,
      notes: noteData,
      globalIpaHidden: document.getElementById('btnToggleAllIpa').textContent === 'Show All IPA',
      globalVieHidden: document.getElementById('btnToggleAllVie').textContent === 'Show All Translations'
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    setTimeout(() => ind.classList.remove('show'), 500);
  }, 300);
}

function loadSavedData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return false;
    const data = JSON.parse(saved);
    if (data.ipaHidden && data.ipaHidden.length) {
      const rows = document.querySelectorAll('.ph-row');
      data.ipaHidden.forEach((hidden, idx) => {
        if (rows[idx]) rows[idx].classList.toggle('hidden-row', hidden);
      });
    }
    if (data.vieHidden && data.vieHidden.length) {
      const rows = document.querySelectorAll('.vi-row');
      data.vieHidden.forEach((hidden, idx) => {
        if (rows[idx]) rows[idx].classList.toggle('hidden-row', hidden);
      });
    }
    noteData = data.notes || [];
    renderNotesList();
    if (data.globalIpaHidden) document.getElementById('btnToggleAllIpa').textContent = 'Show All IPA';
    else document.getElementById('btnToggleAllIpa').textContent = 'Hide All IPA';
    if (data.globalVieHidden) document.getElementById('btnToggleAllVie').textContent = 'Show All Translations';
    else document.getElementById('btnToggleAllVie').textContent = 'Hide All Translations';
    return true;
  } catch(e) { return false; }
}

function initToolbarToggle() {
  const toolbar = document.getElementById('mainToolbar');
  const toggleBtn = document.getElementById('toolbarToggleBtn');
  if (!toolbar || !toggleBtn) return;
  toggleBtn.onclick = function(e) {
    e.preventDefault();
    toolbar.classList.toggle('collapsed');
    toggleBtn.textContent = toolbar.classList.contains('collapsed') ? '▲' : '▼';
    return false;
  };
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btnToggleClearHl').onclick = toggleClearHlMode;
  document.getElementById('btnToggleNoteMode').onclick = toggleNoteMode;
  document.getElementById('btnViewNotes').onclick = () => {
    document.getElementById('notesPanel').classList.toggle('show');
    if (document.getElementById('notesPanel').classList.contains('show')) renderNotesList();
  };
  document.getElementById('closeNotesPanel').onclick = () => document.getElementById('notesPanel').classList.remove('show');
  document.getElementById('btnToggleAllIpa').onclick = toggleGlobalIpa;
  document.getElementById('btnToggleAllVie').onclick = toggleGlobalVie;
  document.getElementById('deleteNoteInsideBtn').onclick = executeDeleteNoteInside;
  document.getElementById('cancelModalBtn').onclick = closeModal;
  document.getElementById('saveNoteBtn').onclick = saveNote;

  initColorPicker();
  buildContent();
  if (!loadSavedData()) {
    showAllIpa();
    showAllVie();
  }
  initToolbarToggle();

  const contentDiv = document.getElementById('content');
  function processSelection() {
    clearTimeout(selectionTimeout);
    selectionTimeout = setTimeout(() => {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.toString().trim()) return;
      const range = sel.getRangeAt(0);
      if (!contentDiv.contains(range.commonAncestorContainer)) return;
      if (isClearHlMode) {
        let targetMark = range.commonAncestorContainer.parentElement?.closest('mark.hl');
        if (targetMark) executeRemoveHighlight(targetMark);
        else {
          const frag = range.cloneContents();
          frag.querySelectorAll('mark.hl').forEach(im => {
            const actualMark = document.querySelector(`mark[data-note-id="${im.dataset.noteId}"]`);
            if (actualMark) executeRemoveHighlight(actualMark);
          });
        }
        sel.removeAllRanges();
        return;
      }
      if (isNoteMode) {
        let targetMark = range.commonAncestorContainer.parentElement?.closest('mark.hl');
        if (!targetMark) {
          targetMark = document.createElement('mark');
          targetMark.className = 'hl pure-note';
          targetMark.dataset.noteId = Date.now() + Math.floor(Math.random() * 1000);
          try { range.surroundContents(targetMark); } catch(e) {
            const frag = range.extractContents();
            targetMark.appendChild(frag);
            range.insertNode(targetMark);
          }
          attachMarkEvents(targetMark);
        }
        openNotePopupForMark(targetMark);
        sel.removeAllRanges();
        return;
      }
      if (range.commonAncestorContainer.parentElement?.closest('mark.hl')) return;
      const mark = document.createElement('mark');
      mark.className = 'hl c' + curColor;
      mark.dataset.noteId = Date.now() + Math.floor(Math.random() * 1000);
      try { range.surroundContents(mark); } catch(e) {
        const frag = range.extractContents();
        mark.appendChild(frag);
        range.insertNode(mark);
      }
      attachMarkEvents(mark);
      sel.removeAllRanges();
      autoSave();
    }, 150);
  }
  contentDiv.addEventListener('mouseup', processSelection);
  contentDiv.addEventListener('touchend', processSelection);
  document.addEventListener('click', (e) => {
    if (!e.target.closest('mark.hl') && !e.target.closest('.toolbar') && !e.target.closest('.modal')) closeModal();
  });
});
</script>
